name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of its release, not a moving tag.
jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13", "3.14"]  # 3.9 is the python3 macOS ships, and the hooks run on whichever is on the path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests' own repositories
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Lint and format
        run: uvx ruff@0.17.4 check . && uvx ruff@0.17.4 format --check .
      - name: Full-text search is in this Python's sqlite3
        run: uv run --no-project --python ${{ matrix.python }} python -c "import sqlite3; sqlite3.connect(':memory:').execute('create virtual table t using fts5(x)')"
      - name: Test, each file on its own; no network, no model, no key
        run: |
          failed=0
          for file in tests/test_*.py; do
            echo "== $file"
            uv run --no-project --python ${{ matrix.python }} python "$file" || failed=1
          done
          exit $failed

  coverage:
    name: Coverage of crossing/ on Python ${{ matrix.python }} on ${{ matrix.os }}, held to its floor in .coveragerc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests' own repositories
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Branch coverage, the hooks' own processes included
        run: sh scripts/coverage.sh

  plugin:
    name: Module and manifests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code, the version the module is tested with
        run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: Validate the manifests
        run: claude plugin validate .
      - name: The module's tests
        run: claude plugin test .
